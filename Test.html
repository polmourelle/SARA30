<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Hola soc el Pol</title>
  <style>
    body {
      font-family: 'Roboto Slab', serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    .box {
      background-color: #90ee90; /* verd clar */
      border: 3px solid black;  /* contorn negre */
      color: black;              /* text negre */
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      padding: 3rem;
      margin-top: 3rem;
      width: 60%;
      max-width: 600px;
      border-radius: 12px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
    }

    .signature {
      position: fixed;
      bottom: 10px;
      right: 15px;
      font-size: 1rem;
      font-style: italic;
      color: white;
      text-shadow: 1px 1px 2px black, -1px -1px 2px black,
                   1px -1px 2px black, -1px 1px 2px black;
      z-index: 3000;
    }
  </style>
</head>
<body>
  <div class="box">
    Hola soc el Pol Hola soc el Pol Hola soc el Pol
    Hola soc el Pol Hola soc el Pol Hola soc el Pol
   
  </div>

  <div class="signature">by Pol M.</div>
</body>
</html>
