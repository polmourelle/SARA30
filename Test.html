<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Breakout - Pol M.</title>
  <style>
    :root{
      --bg:#0f1724;
      --panel:#0b2a3b;
      --accent:#ffd166;
      --brick1:#ef476f;
      --brick2:#06d6a0;
      --brick3:#118ab2;
    }
    html,body{height:100%;margin:0;}
    body{
      background: radial-gradient(circle at 10% 10%, rgba(255,209,102,0.06), transparent 10%),
                  linear-gradient(180deg,#071027 0%, #0f1724 100%);
      display:flex;align-items:center;justify-content:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      color:#fff;
    }

    .container{
      width: min(960px, 95vw);
      max-width: 1000px;
      background: rgba(10,20,30,0.35);
      border-radius:12px;
      padding: 16px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.6);
      display:flex;
      gap:16px;
    }

    /* canvas area */
    .game-area{
      flex:1 1 700px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 8px;
    }
    canvas{
      background: linear-gradient(180deg,#05202b,#0a3a45);
      border-radius:8px;
      width:100%;
      height:auto;
      max-height: 70vh;
      display:block;
    }

    /* side panel */
    .panel{
      width:220px;
      padding:12px;
      background: rgba(255,255,255,0.03);
      border-radius:8px;
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:stretch;
    }
    .panel h2{margin:0;font-size:1.1rem;color:var(--accent);}
    .stat{font-size:0.95rem;color:#ddd;}
    button{
      background:var(--accent);
      color:#031622;
      border:0;padding:10px;border-radius:8px;
      font-weight:600;cursor:pointer;
      box-shadow:0 4px 8px rgba(0,0,0,0.25);
    }
    button:active{transform:translateY(1px);}
    .small{font-size:0.85rem;color:#ccc;}

    /* responsive */
    @media (max-width:820px){
      .container{flex-direction:column;align-items:center}
      .panel{width:100%}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="game-area">
      <canvas id="game"></canvas>
    </div>

    <div class="panel">
      <h2>Breakout - Pol M.</h2>
      <div class="stat">Puntuació: <span id="score">0</span></div>
      <div class="stat">Vides: <span id="lives">3</span></div>
      <div class="stat small">Controls: Mou el ratolí / tecles ← → / Toqueu per iniciar</div>
      <button id="startBtn">Iniciar / Reiniciar</button>
      <div style="flex:1"></div>
      <div class="small">By Pol M.</div>
    </div>
  </div>

<script>
/* Breakout senzill - totes les lògiques aquí mateix per facilitar pujar a GitHub Pages */
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });

  // canvas size responsive: mantindrem aspect ratio
  function resizeCanvas(){
    const ratio = 4/3; // width/height
    const containerWidth = canvas.parentElement.clientWidth;
    const maxHeight = window.innerHeight * 0.72; // limit
    let w = Math.min(containerWidth, 900);
    let h = Math.min(w / ratio, maxHeight);
    canvas.width = Math.floor(w);
    canvas.height = Math.floor(h);
    draw(); // redibuixa
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // estat del joc
  let ball = { x: 50, y: 50, r: 8, vx: 200, vy: -200, speed: 200 };
  let paddle = { w: 100, h: 12, x: 0, y: 0, speed: 600 };
  let bricks = [];
  let rows = 5, cols = 8, brickGap = 6;
  let score = 0, lives = 3;
  let lastTime = null;
  let running = false;
  let started = false;

  // DOM
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const startBtn = document.getElementById('startBtn');

  function initGame(){
    // paddle position
    paddle.w = Math.min(160, canvas.width * 0.18);
    paddle.x = (canvas.width - paddle.w) / 2;
    paddle.y = canvas.height - 36;

    // ball center
    ball.r = Math.max(6, Math.round(canvas.width * 0.0085));
    ball.x = canvas.width/2;
    ball.y = paddle.y - ball.r - 4;
    ball.vx = ball.speed = Math.max(200, Math.round(canvas.width * 0.25));
    ball.vy = -ball.speed;

    // bricks layout (responsive)
    cols = Math.min(10, Math.max(5, Math.floor(canvas.width / 90)));
    rows = 5;
    const brickWidth = Math.floor((canvas.width - (cols+1)*brickGap) / cols);
    const brickHeight = Math.max(16, Math.round(canvas.height * 0.06));

    // build bricks
    bricks = [];
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const x = brickGap + c*(brickWidth+brickGap);
        const y = 40 + r*(brickHeight+brickGap);
        bricks.push({x,y,w:brickWidth,h:brickHeight,alive:true,row:r});
      }
    }

    score = 0; lives = 3;
    updateUI();
    started = false;
    running = false;
    lastTime = null;
    draw();
  }

  function updateUI(){
    scoreEl.textContent = score;
    livesEl.textContent = lives;
  }

  // drawing helpers
  function clear(){
    ctx.fillStyle = '#05232b';
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  function draw(){
    clear();
    // bricks
    bricks.forEach(b=>{
      if(!b.alive) return;
      const colors = ['#ef476f','#ffd166','#06d6a0','#118ab2','#073b4c'];
      ctx.fillStyle = colors[b.row % colors.length];
      roundRect(ctx, b.x, b.y, b.w, b.h, 6, true, false);
      // inner shine
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(b.x+4,b.y+4,b.w-8,b.h/2-4);
    });

    // paddle
    ctx.fillStyle = '#ffd166'; // accent
    roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 6, true, false);

    // ball
    ctx.fillStyle = '#ffffff';
    circle(ctx, ball.x, ball.y, ball.r, true);

    // if not started show message
    if(!started){
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = '16px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('Fes clic o prem una tecla per començar', canvas.width/2, canvas.height/2 - 10);
    }
  }

  function circle(ctx,x,y,r,fill=true){
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    if(fill) ctx.fill(); else ctx.stroke();
  }

  function roundRect(ctx,x,y,w,h,r,fill,stroke){
    if (typeof r === 'undefined') r = 5;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    if(fill) ctx.fill();
    if(stroke) ctx.stroke();
  }

  // main loop
  function loop(ts){
    if(!lastTime) lastTime = ts;
    const dt = Math.min(0.04, (ts - lastTime) / 1000);
    lastTime = ts;
    if(running){
      update(dt);
    }
    draw();
    requestAnimationFrame(loop);
  }

  // collisions
  function update(dt){
    // move ball
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // wall collisions
    if(ball.x - ball.r < 0){ ball.x = ball.r; ball.vx *= -1; }
    if(ball.x + ball.r > canvas.width){ ball.x = canvas.width - ball.r; ball.vx *= -1; }
    if(ball.y - ball.r < 0){ ball.y = ball.r; ball.vy *= -1; }

    // paddle collision
    if(ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h){
      if(ball.x >= paddle.x && ball.x <= paddle.x + paddle.w){
        // reflect based on where it hits on paddle
        const hitPos = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
        const angle = hitPos * (Math.PI/3); // -60..60 degrees
        const speed = Math.hypot(ball.vx, ball.vy);
        ball.vx = Math.sin(angle) * speed;
        ball.vy = -Math.abs(Math.cos(angle) * speed);
        // nudge up
        ball.y = paddle.y - ball.r - 0.1;
      }
    }

    // bricks collision (AABB circle test)
    for(let b of bricks){
      if(!b.alive) continue;
      if(circleRectCollision(ball, b)){
        b.alive = false;
        score += 10;
        updateUI();
        // reflect ball: simplest approach invert vy
        ball.vy *= -1;
        break;
      }
    }

    // fall below
    if(ball.y - ball.r > canvas.height){
      lives--;
      updateUI();
      if(lives <= 0){
        // game over -> reset
        alert('Game over! Puntuació: ' + score);
        initGame();
      } else {
        // reset ball and paddle
        resetBallPaddle();
      }
    }

    // win condition
    if(bricks.every(b=>!b.alive)){
      alert('Has guanyat! Punts: ' + score);
      initGame();
    }
  }

  function circleRectCollision(c, r){
    // find closest point
    const cx = Math.max(r.x, Math.min(c.x, r.x + r.w));
    const cy = Math.max(r.y, Math.min(c.y, r.y + r.h));
    const dx = c.x - cx, dy = c.y - cy;
    return (dx*dx + dy*dy) <= c.r * c.r;
  }

  function resetBallPaddle(){
    paddle.x = (canvas.width - paddle.w) / 2;
    ball.x = canvas.width/2;
    ball.y = paddle.y - ball.r - 4;
    ball.vx = ball.speed * (Math.random() > 0.5 ? 1 : -1);
    ball.vy = -Math.abs(ball.speed);
    running = false;
    started = false;
  }

  // input: mouse move
  canvas.addEventListener('mousemove', (e)=>{
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    paddle.x = Math.min(Math.max(0, mx - paddle.w/2), canvas.width - paddle.w);
  });

  // keyboard
  let leftDown=false,rightDown=false;
  window.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowLeft') leftDown = true;
    if(e.key === 'ArrowRight') rightDown = true;
    if(e.key === ' ' || e.key === '
