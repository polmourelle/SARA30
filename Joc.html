<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 Guanya per descobrir</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #111, #000);
      color: blue;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin: 0.5rem;
      font-size: 1.5rem;
      text-align: center;
    }

    canvas {
      background: #222;
      border: 2px solid gold;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255, 255, 0, 0.3);
      touch-action: none;
    }

    #startButton {
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      margin: 1rem;
      transition: background 0.3s;
      box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3);
    }

    #startButton:hover {
      background: #45a049;
    }

    .controls {
      display: flex;
      justify-content: center;
      width: 100%;
      position: absolute;
      bottom: 20px;
      gap: 2rem;
    }

    .control-btn {
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 50%;
      width: 70px;
      height: 70px;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.4);
      transition: transform 0.1s, background 0.2s;
    }

    .control-btn:active {
      background: #45a049;
      transform: scale(0.9);
    }

    .signature {
      position: fixed;
      bottom: 10px;
      right: 15px;
      font-size: 1rem;
      font-style: italic;
      color: white;
      text-shadow: 1px 1px 2px black, -1px -1px 2px black,
                   1px -1px 2px black, -1px 1px 2px black;
      z-index: 3000;
    }
  </style>
</head>
<body>
  <h1>🎮 Guanya per descobrir</h1>
  <button id="startButton">Iniciar</button>
  <canvas id="gameCanvas"></canvas>

  <div class="controls" id="controls">
    <button id="leftBtn" class="control-btn">⬅️</button>
    <button id="rightBtn" class="control-btn">➡️</button>
  </div>

  <div class="signature">by Polet</div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const startButton = document.getElementById("startButton");
    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");

    // Ajusta mida segons pantalla
    function resizeCanvas() {
      canvas.width = Math.min(window.innerWidth * 0.9, 400);
      canvas.height = window.innerHeight * 0.6;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Variables del joc
    let x, y, dx, dy, paddleX, rightPressed, leftPressed, bricks, score, lives, gameStarted;
    const ballRadius = 7;
    const paddleHeight = 10;
    let paddleWidth = canvas.width * 0.25;
    const brickRowCount = 5;
    const brickColumnCount = 5;
    const brickPadding = 8;
    const brickOffsetTop = 30;
    const brickOffsetLeft = 20;

    function initGame() {
      x = canvas.width / 2;
      y = canvas.height - 30;
      dx = 2;
      dy = -2;
      paddleX = (canvas.width - paddleWidth) / 2;
      rightPressed = false;
      leftPressed = false;
      score = 0;
      lives = 3;
      gameStarted = true;

      const brickWidth = (canvas.width - (brickColumnCount - 1) * brickPadding - 2 * brickOffsetLeft) / brickColumnCount;
      const brickHeight = 18;

      bricks = [];
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1, width: brickWidth, height: brickHeight };
        }
      }

      draw();
    }

    // Controls tàctils
    leftBtn.addEventListener("touchstart", () => (leftPressed = true));
    leftBtn.addEventListener("touchend", () => (leftPressed = false));
    rightBtn.addEventListener("touchstart", () => (rightPressed = true));
    rightBtn.addEventListener("touchend", () => (rightPressed = false));

    // Controls de teclat
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") rightPressed = true;
      if (e.key === "ArrowLeft") leftPressed = true;
    });
    document.addEventListener("keyup", e => {
      if (e.key === "ArrowRight") rightPressed = false;
      if (e.key === "ArrowLeft") leftPressed = false;
    });

    // Dibuix dels elements
    function drawBricks() {
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          if (bricks[c][r].status === 1) {
            const brickX = c * (bricks[c][r].width + brickPadding) + brickOffsetLeft;
            const brickY = r * (bricks[c][r].height + brickPadding) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            ctx.beginPath();
            ctx.rect(brickX, brickY, bricks[c][r].width, bricks[c][r].height);
            ctx.fillStyle = "limegreen";
            ctx.fill();
            ctx.closePath();
          }
        }
      }
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
      ctx.fillStyle = "gold";
      ctx.fill();
      ctx.closePath();
    }

    function drawPaddle() {
      ctx.beginPath();
      ctx.rect(paddleX, canvas.height - paddleHeight - 10, paddleWidth, paddleHeight);
      ctx.fillStyle = "#4CAF50";
      ctx.fill();
      ctx.closePath();
    }

    function drawScore() {
      ctx.font = "14px Arial";
      ctx.fillStyle = "#fff";
      ctx.fillText("Punts: " + score, 8, 20);
    }

    function drawLives() {
      ctx.font = "14px Arial";
      ctx.fillStyle = "#fff";
      ctx.fillText("Vides: " + lives, canvas.width - 70, 20);
    }

    function collisionDetection() {
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            if (x > b.x && x < b.x + b.width && y > b.y && y < b.y + b.height) {
              dy = -dy;
              b.status = 0;
              score++;
              if (score === brickRowCount * brickColumnCount) {
                alert("🎉 Has guanyat! Ara ves a /guanyat.html");
                document.location.reload();
              }
            }
          }
        }
      }
    }

    function draw() {
      if (!gameStarted) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBricks();
      drawBall();
      drawPaddle();
      drawScore();
      drawLives();
      collisionDetection();

      // Rebots
      if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) dx = -dx;
      if (y + dy < ballRadius) dy = -dy;
      else if (y + dy > canvas.height - ballRadius - paddleHeight - 10) {
        if (x > paddleX && x < paddleX + paddleWidth) dy = -dy;
        else {
          lives--;
          if (!lives) {
            alert("😢 Has perdut...");
            document.location.reload();
          } else {
            x = canvas.width / 2;
            y = canvas.height - 30;
            dx = 2;
            dy = -2;
            paddleX = (canvas.width - paddleWidth) / 2;
          }
        }
      }

      // Mou la pala
      const paddleSpeed = 5;
      if (rightPressed && paddleX < canvas.width - paddleWidth) paddleX += paddleSpeed;
      else if (leftPressed && paddleX > 0) paddleX -= paddleSpeed;

      x += dx;
      y += dy;

      requestAnimationFrame(draw);
    }

    startButton.addEventListener("click", () => {
      startButton.style.display = "none";
      initGame();
    });
  </script>
</body>
</html>
