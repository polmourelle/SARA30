<!DOCTYPE html> 
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Roboto Slab', serif;
      margin: 0;
      padding: 2rem;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      background-color: #87CEFA; /* blau cel */
    }

    img.canaries {
      max-width: 90vw;
      max-height: 70vh;
      object-fit: contain;
      margin-top: 2rem;
      border-radius: 10px;
    }

    .box {
      background-color: #90ee90;
      border: 3px solid black;
      color: black;
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      padding: 3rem;
      margin-top: 2rem;
      width: 60%;
      max-width: 600px;
      border-radius: 12px;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
    }

    .signature {
      position: fixed;
      bottom: 10px;
      right: 15px;
      font-size: 1rem;
      font-style: italic;
      color: white;
      text-shadow: 1px 1px 2px black, -1px -1px 2px black,
                   1px -1px 2px black, -1px 1px 2px black;
      z-index: 3000;
    }

    .back-button {
      margin: 2rem auto;
      padding: 1rem 2rem;
      background: #4CAF50;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
      transition: background 0.3s;
    }
    .back-button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>

  <!-- Imatge centrada -->
  <img src="imatges/canaries.jpg" class="canaries">

  <div class="box">
    <p>Què et semblaria si et dic...? </p>
    <p><em>Illes Canàries, 28 de març de 2026</em></p>
  </div>

  <div class="signature">by Polet</div>

  <a href="regals.html" class="back-button">Enrere</a>
</body>
</html>
