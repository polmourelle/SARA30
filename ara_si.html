<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 en Ratlla amb IA (Només 3 Fitxes)</title>
  <style>
    body {
      font-family: 'Roboto Slab', serif;
      background: radial-gradient(circle at center, #0f1724, #020617);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 1rem;
      text-shadow: 0 0 8px #4caf50;
      text-align: center;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 8px;
    }

    .cell {
      background: #1e293b;
      border: 2px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .cell:hover {
      background: #334155;
    }

    .cell.taken {
      cursor: default;
    }

    #status {
      margin-top: 1.5rem;
      font-size: 1.2rem;
    }

    button {
      margin-top: 1rem;
      background: #4caf50;
      border: none;
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #43a047;
    }
  </style>
</head>
<body>
  <h1>3 en Ratlla (Només 3 Fitxes, amb IA 🤖)</h1>
  <div class="board" id="board"></div>
  <div id="status">Torn del jugador: <span id="player">X</span></div>
  <button id="resetBtn">Reinicia</button>

  <script>
    const board = document.getElementById("board");
    const statusText = document.getElementById("status");
    const playerText = document.getElementById("player");
    const resetBtn = document.getElementById("resetBtn");

    let cells = Array(9).fill("");
    let currentPlayer = "X";
    let xMoves = [];
    let oMoves = [];
    let gameOver = false;

    function createBoard() {
      board.innerHTML = "";
      cells.forEach((_, i) => {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.dataset.index = i;
        cell.addEventListener("click", handlePlayerMove);
        board.appendChild(cell);
      });
    }

    function handlePlayerMove(e) {
      const index = e.target.dataset.index;
      if (gameOver || currentPlayer !== "X" || cells[index] !== "") return;

      makeMove(index, "X");
      if (checkWinner("X")) {
        statusText.textContent = `🎉 Has guanyat!`;
        gameOver = true;
        return;
      }

      currentPlayer = "O";
      playerText.textContent = currentPlayer;

      setTimeout(aiMove, 600);
    }

    function makeMove(index, player) {
      cells[index] = player;
      const cell = board.querySelector(`[data-index='${index}']`);
      cell.textContent = player;
      cell.classList.add("taken");

      if (player === "X") {
        xMoves.push(index);
        if (xMoves.length > 3) removeOldestMove("X");
      } else {
        oMoves.push(index);
        if (oMoves.length > 3) removeOldestMove("O");
      }
    }

    function removeOldestMove(player) {
      const moves = player === "X" ? xMoves : oMoves;
      const oldIndex = moves.shift();
      cells[oldIndex] = "";
      const oldCell = board.querySelector(`[data-index='${oldIndex}']`);
      oldCell.textContent = "";
      oldCell.classList.remove("taken");
    }

    function aiMove() {
      if (gameOver) return;

      // Lògica senzilla: busca per guanyar, sinó bloqueja, sinó aleatòria
      const emptyIndexes = cells.map((v, i) => (v === "" ? i : null)).filter(v => v !== null);

      let move = findWinningMove("O") || findWinningMove("X") || randomChoice(emptyIndexes);
      makeMove(move, "O");

      if (checkWinner("O")) {
        statusText.textContent = `😎 La IA ha guanyat!`;
        gameOver = true;
        return;
      }

      currentPlayer = "X";
      playerText.textContent = currentPlayer;
    }

    function findWinningMove(player) {
      const combos = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      for (let combo of combos) {
        const [a,b,c] = combo;
        const vals = [cells[a], cells[b], cells[c]];
        if (vals.filter(v => v === player).length === 2 && vals.includes("")) {
          return combo[vals.indexOf("")];
        }
      }
      return null;
    }

    function randomChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function checkWinner(player) {
      const combos = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      return combos.some(combo => combo.every(i => cells[i] === player));
    }

    resetBtn.addEventListener("click", () => {
      cells = Array(9).fill("");
      xMoves = [];
      oMoves = [];
      gameOver = false;
      currentPlayer = "X";
      playerText.textContent = currentPlayer;
      createBoard();
      statusText.textContent = "Torn del jugador: X";
    });

    createBoard();
  </script>
</body>
</html>
