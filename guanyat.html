<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Era broma! Supera aquest i ho desobriràs.. 🍓</title>
  <style>
    body {
      font-family: 'Roboto Slab', serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      background: radial-gradient(circle, #1b1b1b, #000);
      color: white;
    }

    h1 {
      font-size: 2.2rem;
      margin: 1.5rem 0;
      text-shadow: 2px 2px 4px #000;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 90px);
      gap: 15px;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .card {
      width: 90px;
      height: 90px;
      background-color: #ffffff22;
      border-radius: 12px;
      border: 2px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      perspective: 600px;
      transition: transform 0.4s;
      position: relative;
    }

    .card imatges {
      width: 70%;
      height: 70%;
      object-fit: contain;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card.flipped imatges {
      opacity: 1;
    }

    .card.matched {
      background-color: #00c85355;
      cursor: default;
      border-color: gold;
    }

    .back-button {
      display: inline-block;
      margin: 1rem auto 2rem;
      padding: 1rem 2rem;
      background: #4CAF50;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
      transition: background 0.3s;
    }

    .back-button:hover {
      background: #45a049;
    }

    .signature {
      position: fixed;
      bottom: 10px;
      right: 15px;
      font-size: 1rem;
      font-style: italic;
      color: white;
      text-shadow: 1px 1px 2px black, -1px -1px 2px black,
                   1px -1px 2px black, -1px 1px 2px black;
    }

    @media (max-width: 600px) {
      .game-board {
        grid-template-columns: repeat(3, 80px);
        gap: 10px;
      }
      .card {
        width: 80px;
        height: 80px;
      }
    }
  </style>
</head>
<body>

  <h1>Joc del Memory 🍓</h1>
  <div class="game-board" id="gameBoard"></div>

  <a href="inici.html" class="back-button">Enrere</a>
  <div class="signature">by Polet</div>

  <script>
    const images = [
      'imatges/1.png',
      'imatges/2.png',
      'imatges/3.png',
      'imatges/4.png',
      'imatges/5.png',
      'imatges/6.png'
    ];

    let cards = [...images, ...images]; // Dues de cada
    cards.sort(() => 0.5 - Math.random());

    const gameBoard = document.getElementById('gameBoard');
    let flippedCards = [];
    let matchedPairs = 0;

    cards.forEach((src, index) => {
      const card = document.createElement('div');
      card.classList.add('card');
      card.dataset.image = src;
      card.innerHTML = `<imatges src="${src}" alt="Imatge ${index}">`;
      card.addEventListener('click', handleCardClick);
      gameBoard.appendChild(card);
    });

    function handleCardClick() {
      if (this.classList.contains('flipped') || this.classList.contains('matched')) return;
      this.classList.add('flipped');
      flippedCards.push(this);

      if (flippedCards.length === 2) {
        const [card1, card2] = flippedCards;
        if (card1.dataset.image === card2.dataset.image) {
          card1.classList.add('matched');
          card2.classList.add('matched');
          matchedPairs++;
          flippedCards = [];
          if (matchedPairs === images.length) {
            setTimeout(() => alert('🎉 Has guanyat! Totes les parelles trobades!'), 500);
          }
        } else {
          setTimeout(() => {
            card1.classList.remove('flipped');
            card2.classList.remove('flipped');
            flippedCards = [];
          }, 800);
        }
      }
    }
  </script>
</body>
</html>
