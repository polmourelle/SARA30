<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Spotify QR</title>
  <style>
    body {
      margin: 0;
      background-color: black; /* Fons completament negre */
      display: flex;
      justify-content: center; /* Centra horitzontalment */
      align-items: center;     /* Centra verticalment */
      height: 100vh;           /* Ocupa tota l'alçada de la pantalla */
      flex-direction: column;
    }

    img {
      max-width: 80vw;  /* Fa que la imatge mai surti de la pantalla */
      max-height: 80vh;
      width: auto;
      height: auto;
    }

    .back-button {
      margin-top: 2rem;
      padding: 1rem 2rem;
      background: #4CAF50;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
      transition: background 0.3s;
    }

    .back-button:hover {
      background: #45a049;
    }

    .signature {
      position: fixed;
      bottom: 10px;
      right: 15px;
      font-size: 1rem;
      font-style: italic;
      color: white;
      text-shadow: 1px 1px 2px black, -1px -1px 2px black,
                   1px -1px 2px black, -1px 1px 2px black;
      z-index: 3000;
    }
  </style>
</head>
<body>
  <!-- Imatge centrada -->
  <img src="imatges/spotify_qr.png">

  <!-- Botó per tornar enrere -->
  <a href="inici.html" class="back-button">Enrere</a>

  <!-- Signatura -->
  <div class="signature">by Polet</div>
</body>
</html>
